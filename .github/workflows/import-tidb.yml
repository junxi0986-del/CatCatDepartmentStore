name: 导入数据到 TiDB Cloud（临时工作流，导入完成后删除）

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 导入数据
        run: |
          mysql --host="${{ secrets.DB_HOST }}" \
                --port="${{ secrets.DB_PORT }}" \
                --user="${{ secrets.DB_USER }}" \
                --password="${{ secrets.DB_PASSWORD }}" \
                --ssl-mode=REQUIRED \
                --default-character-set=utf8mb4 \
                -D ecommerce_system \
                -e "source tidb_init.sql"

      - name: 验证导入结果
        run: |
          mysql --host="${{ secrets.DB_HOST }}" \
                --port="${{ secrets.DB_PORT }}" \
                --user="${{ secrets.DB_USER }}" \
                --password="${{ secrets.DB_PASSWORD }}" \
                --ssl-mode=REQUIRED \
                -D ecommerce_system \
                -e "SELECT 'product' AS 表, COUNT(*) AS 行数 FROM product
                    UNION ALL SELECT 'user', COUNT(*) FROM user
                    UNION ALL SELECT 'order_info', COUNT(*) FROM order_info
                    UNION ALL SELECT 'admin', COUNT(*) FROM admin
                    UNION ALL SELECT 'cart', COUNT(*) FROM cart
                    UNION ALL SELECT 'coupon', COUNT(*) FROM coupon
                    UNION ALL SELECT 'knowledge', COUNT(*) FROM knowledge"
