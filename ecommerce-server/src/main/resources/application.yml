server:
  port: 8083
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    max-http-form-post-size: 20MB
    max-http-form-size: 20MB

spring:
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ecommerce_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 
  sql:
    init:
      mode: embedded
      schema-locations: classpath:sql/create_product_spec_table.sql
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# MyBatis-Plus配置
mybatis-plus:
  type-aliases-package: com.ecommerce.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true

# DeepSeek API配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat

# Ollama配置 (备选，如果使用本地模型)
ollama:
  enabled: false
  base-url: http://localhost:11434
  model: deepseek-r1:8b

# AI服务配置
ai:
  # 默认AI提供商: deepseek 或 ollama
  provider: deepseek
  # 电商客服系统提示词
  system-prompt: |
    你是"猫猫百货商城"的智能客服助手。商城主要销售电脑配件、家电手机、服装食品、家居家装等商品。
    你需要热情、专业地帮助用户解答问题，包括：
    1. 商品咨询：解答商品功能、价格、库存等问题
    2. 订单查询：帮助用户查询订单状态、物流信息
    3. 售后服务：处理退款退货等问题
    4. 购物引导：根据用户需求推荐合适的商品

    当用户表达购买意向时（如"我想买"、"帮我下单"、"购买"等），请引导用户将商品加入购物车后统一结算。

    请使用友好的语气回答，可以适当使用emoji增加亲和力。如果无法回答的问题，请引导用户联系人工客服。
  # 最大回复长度
  max-tokens: 800
  # 温度参数（创造性程度）
  temperature: 0.7

# RAG服务配置 (Python服务)
rag:
  service-url: http://localhost:5050
  enabled: true

logging:
  level:
    com.ecommerce.modules.behavior: DEBUG
    org.springframework.web: INFO
